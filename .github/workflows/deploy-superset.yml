name: Ephemeral Superset Public Deployment

on:
  workflow_dispatch: 

jobs:
  deploy-and-expose:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository Code
      uses: actions/checkout@v4

    # 1. Spin up the local Kubernetes single-node environment inside the runner
    - name: ☸️ Boot Up Local Kubernetes Node (KinD)
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: superset-free-node

    # 2. Deploy directly via Helm using the official Bitnami OCI Registry endpoint
    - name: 🚀 Install Superset via Bitnami OCI Registry
      run: |
        helm install superset oci://registry-1.docker.io/bitnamicharts/superset \
          --namespace analytical-apps \
          --create-namespace \
          --set replicaCount=1 \
          --set postgresql.enabled=false \
          --set redis.enabled=false \
          --set auth.adminPassword=AdminPassword123

    # 3. Block execution until the core web server reads healthy
    - name: ⏳ Await Container Initialization
      run: |
        echo "Waiting up to 5 minutes for the light web container to load..."
        kubectl rollout status deployment/superset -n analytical-apps --timeout=300s

    # 4. Open the reverse proxy network pipe to Cloudflare for a free public link
    - name: 🌐 Launch Anonymous Public URL Tunnel
      run: |
        curl -L --output cloudflared.deb https://github.com
        sudo dpkg -i cloudflared.deb
        
        kubectl port-forward svc/superset 8088:8088 -n analytical-apps &
        sleep 5
        
        echo "=========================================================="
        echo "🎉 SUCCESS! LOOK BELOW FOR YOUR TEMPORARY PUBLIC LINK 🎉"
        echo "=========================================================="
        
        cloudflared tunnel --url http://localhost:8088
