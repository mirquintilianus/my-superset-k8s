name: Ephemeral Superset with Docker Compose

on:
  workflow_dispatch: # Trigger manually from the GitHub Actions tab

jobs:
  launch-superset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Official Superset Repository
        run: |
          echo "Cloning the Apache Superset source files..."
          git clone --depth 1 https://github.com superset-src

      - name: Start Superset via Docker Compose
        run: |
          cd superset-src
          echo "Starting Superset containers (this downloads and builds components)..."
          # Using the non-dev profile runs a lightweight, production-like version
          docker compose -f docker-compose-non-dev.yml up -d
          
      - name: Wait for Web UI to Initialize
        run: |
          echo "Waiting for the web interface on port 8088 to become responsive..."
          # Poll the local port until it returns a successful HTTP status code
          until $(curl --output /dev/null --silent --head --fail http://localhost:8088); do
            printf '.'
            sleep 5
          done
          echo -e "\nSuperset is fully up and running locally!"

      - name: Setup cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Start TryCloudflare Tunnel
        uses: AnimMouse/setup-cloudflared/tunnel@v2
        with:
          url: http://localhost:8088

      - name: Keep Runner Alive
        run: |
          echo "--------------------------------------------------------"
          echo "👉 LOOK UPWARDS IN THE CONSOLE LOG FOR THE PUBLIC URL 👈"
          echo "It will look like: https://trycloudflare.com"
          echo "--------------------------------------------------------"
          echo "Default Credentials -> User: admin | Pass: admin"
          echo "--------------------------------------------------------"
          # Keeps the runner alive for up to 6 hours or until you click 'Cancel'
          sleep 21600
