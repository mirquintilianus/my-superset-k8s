name: Ephemeral Superset Public Deployment

on:
  workflow_dispatch: 

jobs:
  deploy-and-expose:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository Code
      uses: actions/checkout@v4

    # 1. Spin up the local Kubernetes single-node environment inside the runner
    - name: ☸️ Boot Up Local Kubernetes Node (KinD)
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: superset-free-node

    # 2. Deploy via OCI Registry with lightweight internal dependencies active
    - name: 🚀 Install Superset via Bitnami OCI Registry
      run: |
        helm install superset oci://registry-1.docker.io/bitnamicharts/superset \
          --namespace analytical-apps \
          --create-namespace \
          --set replicaCount=1 \
          --set worker.replicaCount=0 \
          --set celeryBeat.enabled=false \
          --set postgresql.persistence.enabled=false \
          --set redis.architecture=standalone \
          --set redis.master.persistence.enabled=false \
          --set auth.adminPassword=AdminPassword123

    # 3. Block execution until Bitnami's web server deployment reads healthy
    - name: ⏳ Await Container Initialization
      run: |
        echo "Waiting up to 5 minutes for the Bitnami web container to load..."
        kubectl rollout status deployment/superset-web -n analytical-apps --timeout=300s

    # 4. Open the reverse proxy network pipe to Cloudflare for a free public link
    - name: 🌐 Launch Anonymous Public URL Tunnel
      run: |
        curl -L --output cloudflared.deb https://github.com
        sudo dpkg -i cloudflared.deb
        
        # Map the correct Bitnami service name (superset-web) to runner port 8088
        kubectl port-forward svc/superset-web 8088:8088 -n analytical-apps &
        sleep 5
        
        echo "=========================================================="
        echo "🎉 SUCCESS! LOOK BELOW FOR YOUR TEMPORARY PUBLIC LINK 🎉"
        echo "=========================================================="
        
        cloudflared tunnel --url http://localhost:8088
