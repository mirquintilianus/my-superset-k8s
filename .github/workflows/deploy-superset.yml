name: Deploy Ephemeral Superset

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  deploy-superset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Minikube (Ephemeral Kubernetes Node)
        id: minikube
        uses: medyagh/setup-minikube@master
        with:
          container-runtime: docker
          kubernetes-version: v1.30.0

      - name: Install Apache Superset via Helm
        run: |
          helm repo add superset https://apache.github.io/superset
          helm repo update
          
          # Deploying with minimalist configuration for fast CI startup
          helm install superset superset/superset \
            --set persistence.enabled=false \
            --set postgresql.persistence.enabled=false \
            --set supersetNode.replicaCount=1 \
            --set supersetWorker.replicaCount=1
            
          echo "Waiting for Superset pods to spin up..."
          kubectl rollout status deployment/superset --timeout=5m

      - name: Install Cloudflared CLI
        run: |
          curl -L --output cloudflared.deb https://github.com
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Quick Tunnel & Expose Service
        run: |
          echo "--------------------------------------------------------"
          echo "🚀 GENERATING YOUR PUBLIC ACCESS LINK BELOW..."
          echo "--------------------------------------------------------"
          
          # Background port-forwarding from the k8s cluster to the local runner network
          kubectl port-forward svc/superset 8088:8088 &
          
          # Sleep briefly to ensure port-forwarding channel is established
          sleep 5 
          
          # Run the cloudflared quick tunnel. 
          # It routes to the port-forwarded localhost endpoint.
          cloudflared tunnel --url http://localhost:8088
