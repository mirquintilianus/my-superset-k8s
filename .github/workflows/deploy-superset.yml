name: Ephemeral Superset with TryCloudflare

on:
  workflow_dispatch:

jobs:
  deploy-superset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Minikube (Kubernetes)
        uses: medyagh/setup-minikube@master
        with:
          container-runtime: docker
          kubernetes-version: v1.30.0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Add Apache Superset Helm Repo
        run: |
          helm repo add superset https://apache.github.io/superset
          helm repo update

      - name: Deploy Superset with Minimal Resource Config
        run: |
          helm install superset superset/superset \
            --set bootstrapScript="pip install mysqlclient elasticsearch-dbapi" \
            --set supersetNode.resources.requests.cpu="500m" \
            --set supersetNode.resources.requests.memory="1Gi" \
            --set supersetWorker.resources.requests.cpu="500m" \
            --set supersetWorker.resources.requests.memory="1Gi"

      - name: Wait for Superset Pods to be Ready
        run: |
          echo "Waiting for Superset to initialize... (This can take 3-5 minutes)"
          kubectl wait --namespace default \
            --for=condition=ready pod \
            --selector=app=superset \
            --timeout=400s

      - name: Port-Forward Kubernetes Service
        run: |
          # Forward Superset to the runner's local port 8088 in the background
          kubectl port-forward svc/superset 8088:8088 &
          sleep 5

      - name: Setup cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Start TryCloudflare Tunnel
        uses: AnimMouse/setup-cloudflared/tunnel@v2
        with:
          url: http://localhost:8088

      - name: Keep Runner Alive
        run: |
          echo "--------------------------------------------------------"
          echo "👉 LOOK UPWARDS IN THE CONSOLE LOG FOR THE PUBLIC URL 👈"
          echo "It will look like: https://trycloudflare.com"
          echo "--------------------------------------------------------"
          # Keeps the job running so you can use the UI (Max 6 hours)
          sleep 21600 
