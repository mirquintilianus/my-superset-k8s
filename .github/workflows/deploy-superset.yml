name: Ephemeral Superset (Zero Clone Setup)

on:
  workflow_dispatch:

jobs:
  launch-superset:
    runs-on: ubuntu-latest
    steps:
      - name: Create Minimal Docker Compose Configuration
        run: |
          cat << 'EOF' > docker-compose.yml
          version: '3.8'
          services:
            superset-db:
              image: postgres:15
              container_name: superset_db
              environment:
                POSTGRES_DB: superset
                POSTGRES_USER: superset
                POSTGRES_PASSWORD: superset_password
              volumes:
                - pgdata:/var/lib/postgresql/data

            superset:
              image: apache/superset:latest
              container_name: superset_app
              command: >
                sh -c "
                superset db upgrade &&
                superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin &&
                superset init &&
                /usr/bin/run-server.sh
                "
              ports:
                - "8088:8088"
              depends_on:
                - superset-db
              environment:
                SUPERSET_SECRET_KEY: "secret_key_for_temporary_github_actions_run"
                SQLALCHEMY_DATABASE_URI: postgresql://superset:superset_password@superset-db:5432/superset

          volumes:
            pgdata:
          EOF

      - name: Start Superset Containers
        run: |
          echo "Pulling official images and initializing database..."
          docker compose up -d

      - name: Wait for Web UI to Initialize
        run: |
          echo "Waiting for the web interface on port 8088 to become responsive..."
          echo "This typically takes 60-90 seconds for database migrations to complete."
          until $(curl --output /dev/null --silent --head --fail http://localhost:8088); do
            printf '.'
            sleep 5
          done
          echo -e "\nSuperset is fully up and running!"

      - name: Setup cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Start TryCloudflare Tunnel
        uses: AnimMouse/setup-cloudflared/tunnel@v2
        with:
          url: http://localhost:8088

      - name: Keep Runner Alive
        run: |
          echo "--------------------------------------------------------"
          echo "👉 LOOK UPWARDS IN THE CONSOLE LOG FOR THE PUBLIC URL 👈"
          echo "It will look like: https://trycloudflare.com"
          echo "--------------------------------------------------------"
          echo "Default Credentials -> User: admin | Pass: admin"
          echo "--------------------------------------------------------"
          # Keeps the runner alive for up to 6 hours
          sleep 21600
